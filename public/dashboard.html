<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Kivo</title>
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-lion-32.png">
</head>

<body>

    <div class="app-shell">

        <!-- Top bar -->
        <header class="topbar">
            <div class="topbar-left">
                <span class="brand">Kivo</span>
            </div>
            <div class="topbar-right">
                <div class="user-chip">
                    <span class="user-chip-avatar" id="user-avatar"></span>
                    <span class="sidebar-username" id="sidebar-username"></span>
                </div>
                <button class="btn-new-roadmap">+ New Roadmap</button>
                <button class="btn-logout" id="logout-btn">Log out</button>
            </div>
        </header>

        <!-- Page content -->
        <main class="page">
            <div class="page-head">
                <h1 class="page-title">Your Roadmaps</h1>
                <p id="page-subtitle"></p>
            </div>

            <div class="roadmaps-grid">
                <!-- populated by JavaScript -->
            </div>
        </main>

    </div>

    <!-- Create Roadmap Modal -->
    <div id="create-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Create New Roadmap</h3>
                <button id="close-modal" class="btn-close">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="roadmap-name">Name</label>
                    <input type="text" id="roadmap-name" placeholder="e.g., Server Roadmap" />
                </div>
                <div class="form-group">
                    <label for="roadmap-description">Description</label>
                    <textarea id="roadmap-description" rows="4" placeholder="What's this roadmap about?"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button id="cancel-btn" class="btn-cancel">Cancel</button>
                <button id="create-btn" class="btn-create">Create Roadmap</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="delete-modal" class="modal">
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h3>Delete Roadmap?</h3>
                <button id="close-delete-modal" class="btn-close">×</button>
            </div>
            <div class="modal-body">
                <p class="delete-warning">Are you sure you want to delete this roadmap? This action cannot be
                    undone.</p>
            </div>
            <div class="modal-footer">
                <button id="cancel-delete-btn" class="btn-cancel">Cancel</button>
                <button id="confirm-delete-btn" class="btn-delete">Delete</button>
            </div>
        </div>
    </div>

    <!-- Rename Modal-->
    <div id="rename-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit Roadmap</h3>
                <button id="close-rename-modal" class="btn-close">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="rename-roadmap-name">Name</label>
                    <input type="text" id="rename-roadmap-name" placeholder="e.g., Server Roadmap" />
                </div>
                <div class="form-group">
                    <label for="rename-roadmap-description">Description</label>
                    <textarea id="rename-roadmap-description" rows="4"
                        placeholder="What's this roadmap about?"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button id="cancel-rename-btn" class="btn-cancel">Cancel</button>
                <button id="rename-btn" class="btn-create">Save edits</button>
            </div>
        </div>
    </div>

    <!-- Manage Access Modal -->
    <div id="access-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Manage Access</h3>
                <button id="close-access-modal" class="btn-close">×</button>
            </div>
            <div class="modal-body">
                <div class="access-list" id="access-list">
                    <!-- Populated by JavaScript -->
                </div>

                <div class="access-add">
                    <div class="form-group">
                        <label for="access-username">Add a person</label>
                        <input type="text" id="access-username" placeholder="username" />
                    </div>
                    <div class="form-group access-role-group">
                        <label for="access-role">Role</label>
                        <select id="access-role" class="access-role-select">
                            <option value="editor">Editor</option>
                            <option value="viewer">Viewer</option>
                        </select>
                    </div>
                    <button id="access-add-btn" class="btn-create access-add-btn">Add</button>
                    <p class="auth-error" id="access-error"></p>
                </div>

                <div class="public-share">
                    <label class="public-share-label">Public link — anyone with the link can view (read-only)</label>
                    <button id="share-create-btn" class="btn-cancel share-create-btn">Create public link</button>
                    <div id="share-link-box" class="share-link-box" style="display:none;">
                        <input type="text" id="share-link-input" class="share-link-input" readonly />
                        <button id="share-copy-btn" class="btn-create share-copy-btn">Copy</button>
                        <button id="share-disable-btn" class="access-remove share-disable-btn">Disable</button>
                    </div>
                    <p id="share-stats" class="share-stats" style="display:none;"></p>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="scripts/app.js"></script>
</body>

</html>
