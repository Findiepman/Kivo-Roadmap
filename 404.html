<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Kivo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="public/favicon-lion-32.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background:
                radial-gradient(800px 500px at 15% 0%, rgba(191, 224, 247, 0.9), transparent 60%),
                radial-gradient(700px 450px at 90% 20%, rgba(191, 224, 247, 0.65), transparent 60%),
                #f2f8fe;
            color: #12324e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            text-align: center;
            max-width: 600px;
        }

        .error-code {
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 9rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.05em;
            color: #bfe0f7;
            margin-bottom: 1rem;
        }

        h1 {
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 2.3rem;
            font-weight: 800;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 1.1rem;
            color: #557595;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            background: #1b6fb8;
            color: white;
            padding: 0.9rem 2.4rem;
            border-radius: 999px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.2s;
            box-shadow: 0 8px 24px rgba(27, 111, 184, 0.25);
        }

        .btn:hover {
            transform: translateY(-2px);
            background: #155a97;
        }

        @media (max-width: 600px) {
            .error-code {
                font-size: 5.5rem;
            }

            h1 {
                font-size: 1.7rem;
            }

            p {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="error-code">404</div>
        <h1>Page not found</h1>
        <p>This page doesn't exist. Maybe it got deleted, or maybe you took a wrong turn.</p>
        <a href="dashboard.html" class="btn">Back to your roadmaps</a>
    </div>
</body>

</html>
