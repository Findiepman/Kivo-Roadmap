<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings - Kivo</title>
    <link rel="stylesheet" href="public/styles/theme.css">
    <link rel="stylesheet" href="public/styles/settings.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="public/favicon.svg">
</head>

<body class="sky-body">

    <header class="topbar">
        <div class="topbar-left">
            <a href="dashboard.html" class="icon-link" title="Back to dashboard" aria-label="Back to dashboard"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
            <a class="brand" href="dashboard.html">Kivo<span class="brand-dot">.</span></a>
        </div>
        <div class="topbar-right">
            <button class="btn-ghost btn-small" id="logout-btn">Log out</button>
        </div>
    </header>

    <main class="page">
        <div class="page-head">
            <h1 class="page-title">Settings</h1>
        </div>

        <!-- Your account -->
        <section class="settings-card">
            <h2 class="card-title">Your account</h2>
            <div class="account-row">
                <span class="avatar avatar-lg" id="me-avatar"></span>
                <div>
                    <p class="account-name" id="me-username"></p>
                    <span class="role-badge" id="me-role"></span>
                </div>
            </div>
            <p class="card-note" id="account-note" style="display:none;">
                Accounts are managed by an admin. Ask them if you need your username or password changed.
            </p>
        </section>

        <!-- Admins: accounts are managed from the admin dashboard -->
        <section class="settings-card" id="admin-panel" style="display:none;">
            <h2 class="card-title">Accounts</h2>
            <p class="card-note">
                As an admin you create accounts, change usernames and passwords and delete accounts
                from the dashboard, next to every roadmap.
            </p>
            <a class="btn" href="dashboard.html">Open the admin dashboard</a>
        </section>
    </main>

    <script type="module" src="public/scripts/settings.js"></script>
</body>

</html>
