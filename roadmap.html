<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roadmap - Kivo</title>
    <link rel="stylesheet" href="public/styles/theme.css">
    <link rel="stylesheet" href="public/styles/roadmap.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="public/favicon.svg">
</head>

<body class="sky-body">

    <header class="topbar">
        <div class="topbar-left">
            <a href="dashboard.html" class="icon-link" title="Back to dashboard" aria-label="Back to dashboard"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
            <div class="board-title">
                <h1 id="roadmap-title"></h1>
                <p class="roadmap-meta" id="roadmap-meta"></p>
            </div>
        </div>
        <div class="topbar-right">
            <div class="avatar-stack" id="member-stack" title="Members"></div>
            <div class="view-seg" id="view-seg" role="group" aria-label="Layout">
                <button type="button" data-view="list">List</button>
                <button type="button" data-view="board">Board</button>
            </div>
            <button class="btn" id="add-task-btn">+ Add task</button>
        </div>
    </header>

    <main class="page">
        <div class="list-view" id="task-view">
            <section class="status-section" data-status="planned">
                <div class="section-header">
                    <span class="section-dot planned"></span>
                    <h2>Planned</h2>
                    <span class="section-count" id="count-planned">0</span>
                </div>
                <div class="task-rows" id="rows-planned"></div>
                <p class="section-empty" id="empty-planned">Nothing planned yet.</p>
            </section>

            <section class="status-section" data-status="in_progress">
                <div class="section-header">
                    <span class="section-dot in_progress"></span>
                    <h2>In progress</h2>
                    <span class="section-count" id="count-in_progress">0</span>
                </div>
                <div class="task-rows" id="rows-in_progress"></div>
                <p class="section-empty" id="empty-in_progress">Nothing is being worked on right now.</p>
            </section>

            <section class="status-section" data-status="finished">
                <div class="section-header">
                    <span class="section-dot finished"></span>
                    <h2>Finished</h2>
                    <span class="section-count" id="count-finished">0</span>
                </div>
                <div class="task-rows" id="rows-finished"></div>
                <p class="section-empty" id="empty-finished">Nothing finished yet.</p>
            </section>
        </div>
    </main>

    <!-- Task modal: used for creating and for viewing/editing a task -->
    <div id="task-modal" class="modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="task-modal-title">New task</h3>
                <button id="close-task-modal" class="btn-close" aria-label="Close"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="task-name">Name</label>
                    <input type="text" id="task-name" placeholder="e.g. Pets v1.1.0" />
                </div>
                <div class="form-group">
                    <label for="task-desc">Description</label>
                    <textarea id="task-desc" rows="4" placeholder="Describe this task"></textarea>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <div class="status-seg" id="task-status-seg">
                        <button type="button" data-status="planned">Planned</button>
                        <button type="button" data-status="in_progress">In progress</button>
                        <button type="button" data-status="finished">Finished</button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="task-tags">Tags</label>
                    <input type="text" id="task-tags" placeholder="comma separated, e.g. Economy, Mining" />
                </div>
                <div class="form-group" id="assignees-group">
                    <label>Who is working on this?</label>
                    <div class="assignee-picker" id="task-assignees"></div>
                </div>
                <div class="comments-block" id="comments-block" style="display:none;">
                    <h4 class="block-title">Comments</h4>
                    <div class="comments" id="comment-list"></div>
                    <div class="comment-form">
                        <textarea id="comment-text" rows="2" maxlength="1000" placeholder="Write a comment" aria-label="Write a comment"></textarea>
                        <button type="button" id="post-comment-btn" class="btn btn-small">Post</button>
                    </div>
                    <p class="form-error" id="comment-error"></p>
                </div>
                <p class="form-error" id="task-error"></p>
            </div>
            <div class="modal-footer">
                <button id="delete-task-btn" class="btn-danger-ghost push-left" style="display:none;">Delete task</button>
                <button id="cancel-task-btn" class="btn-ghost">Cancel</button>
                <button id="save-task-btn" class="btn">Save task</button>
            </div>
        </div>
    </div>

    <!-- Delete task confirmation -->
    <div id="delete-task-modal" class="modal">
        <div class="modal-card modal-small">
            <div class="modal-header">
                <h3>Delete task?</h3>
                <button id="close-delete-task-modal" class="btn-close" aria-label="Close"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
            </div>
            <div class="modal-body">
                <p class="delete-warning">This removes the task for everyone. There is no undo.</p>
            </div>
            <div class="modal-footer">
                <button id="cancel-delete-task-btn" class="btn-ghost">Cancel</button>
                <button id="confirm-delete-task-btn" class="btn-danger">Delete task</button>
            </div>
        </div>
    </div>

    <!-- Delete comment confirmation -->
    <div id="delete-comment-modal" class="modal">
        <div class="modal-card modal-small">
            <div class="modal-header">
                <h3>Delete comment?</h3>
                <button id="close-delete-comment-modal" class="btn-close" aria-label="Close"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
            </div>
            <div class="modal-body">
                <p class="delete-warning">This removes the comment for everyone. There is no undo.</p>
            </div>
            <div class="modal-footer">
                <button id="cancel-delete-comment-btn" class="btn-ghost">Cancel</button>
                <button id="confirm-delete-comment-btn" class="btn-danger">Delete comment</button>
            </div>
        </div>
    </div>

    <script type="module" src="public/scripts/roadmaps.js"></script>
</body>

</html>
