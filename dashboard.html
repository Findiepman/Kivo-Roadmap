<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Kivo</title>
    <link rel="stylesheet" href="public/styles/theme.css">
    <link rel="stylesheet" href="public/styles/dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-lion-32.png">
</head>

<body class="sky-body">

    <header class="topbar">
        <div class="topbar-left">
            <a class="brand" href="dashboard.html">Kivo<span class="brand-dot">.</span></a>
        </div>
        <div class="topbar-right">
            <button class="btn btn-new-roadmap" id="new-roadmap-btn">+ New roadmap</button>
            <a class="icon-link" href="settings.html" title="Settings" aria-label="Settings">&#9881;</a>
            <div class="user-chip">
                <span class="avatar" id="user-avatar"></span>
                <span id="topbar-username"></span>
            </div>
            <button class="btn-ghost btn-small" id="logout-btn">Log out</button>
        </div>
    </header>

    <main class="page">
        <div class="page-head">
            <p class="page-eyebrow" id="page-subtitle"></p>
            <h1 class="page-title">Your roadmaps</h1>
        </div>

        <div class="roadmap-list" id="roadmap-list">
            <!-- populated by JavaScript -->
        </div>

        <div class="empty-state" id="empty-state" style="display:none;">
            <div class="empty-cloud">&#9729;</div>
            <h2>Nothing here yet</h2>
            <p id="empty-text">Roadmaps shared with you will show up here.</p>
        </div>
    </main>

    <!-- Create roadmap modal -->
    <div id="create-modal" class="modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>New roadmap</h3>
                <button id="close-modal" class="btn-close" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="roadmap-name">Name</label>
                    <input type="text" id="roadmap-name" placeholder="e.g. Server roadmap" />
                </div>
                <div class="form-group">
                    <label for="roadmap-description">Description</label>
                    <textarea id="roadmap-description" rows="3" placeholder="What is this roadmap about?"></textarea>
                </div>
                <p class="form-error" id="create-error"></p>
            </div>
            <div class="modal-footer">
                <button id="cancel-btn" class="btn-ghost">Cancel</button>
                <button id="create-btn" class="btn">Create roadmap</button>
            </div>
        </div>
    </div>

    <!-- Edit roadmap modal -->
    <div id="rename-modal" class="modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Edit roadmap</h3>
                <button id="close-rename-modal" class="btn-close" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="rename-roadmap-name">Name</label>
                    <input type="text" id="rename-roadmap-name" />
                </div>
                <div class="form-group">
                    <label for="rename-roadmap-description">Description</label>
                    <textarea id="rename-roadmap-description" rows="3"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button id="cancel-rename-btn" class="btn-ghost">Cancel</button>
                <button id="rename-btn" class="btn">Save changes</button>
            </div>
        </div>
    </div>

    <!-- Delete roadmap modal -->
    <div id="delete-modal" class="modal">
        <div class="modal-card modal-small">
            <div class="modal-header">
                <h3>Delete roadmap?</h3>
                <button id="close-delete-modal" class="btn-close" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
                <p class="delete-warning">This removes the roadmap and every task in it. There is no undo.</p>
            </div>
            <div class="modal-footer">
                <button id="cancel-delete-btn" class="btn-ghost">Cancel</button>
                <button id="confirm-delete-btn" class="btn-danger">Delete roadmap</button>
            </div>
        </div>
    </div>

    <!-- Sharing modal -->
    <div id="access-modal" class="modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Share this roadmap</h3>
                <button id="close-access-modal" class="btn-close" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="access-username">Add a member by username</label>
                    <div class="access-add-row">
                        <input type="text" id="access-username" placeholder="username" />
                        <button id="access-add-btn" class="btn btn-small">Add</button>
                    </div>
                </div>
                <p class="form-error" id="access-error"></p>

                <div class="access-list" id="access-list"></div>

                <div class="public-share">
                    <label class="public-share-label">Public link. Anyone with the link can view this roadmap without an account.</label>
                    <button id="share-create-btn" class="btn-ghost btn-small">Create public link</button>
                    <div id="share-link-box" class="share-link-box" style="display:none;">
                        <input type="text" id="share-link-input" class="share-link-input" readonly />
                        <button id="share-copy-btn" class="btn btn-small">Copy</button>
                        <button id="share-disable-btn" class="btn-danger-ghost btn-small">Disable</button>
                    </div>
                    <p id="share-stats" class="share-stats" style="display:none;"></p>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="public/scripts/app.js"></script>
</body>

</html>
