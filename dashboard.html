<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Kivo</title>
    <link rel="stylesheet" href="public/styles/theme.css">
    <link rel="stylesheet" href="public/styles/dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="public/favicon.svg">
</head>

<body class="sky-body">

    <header class="topbar">
        <div class="topbar-left">
            <a class="brand" href="dashboard.html">Kivo<span class="brand-dot">.</span></a>
        </div>
        <div class="topbar-right">
            <button class="btn btn-new-roadmap" id="new-roadmap-btn">+ New roadmap</button>
            <a class="icon-link" href="settings.html" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></a>
            <div class="user-chip">
                <span class="avatar" id="user-avatar"></span>
                <span id="topbar-username"></span>
            </div>
            <button class="btn-ghost btn-small" id="logout-btn">Log out</button>
        </div>
    </header>

    <main class="page" id="dash-page">
        <div class="page-head">
            <p class="page-eyebrow" id="page-subtitle"></p>
            <h1 class="page-title" id="page-title">Your roadmaps</h1>
        </div>

        <!-- Admins see two columns (every roadmap + every account); everyone
             else only the roadmap column. -->
        <div class="dash-grid" id="dash-grid">
            <section class="dash-col">
                <div class="col-head" id="roadmaps-head" style="display:none;">
                    <h2>Roadmaps</h2>
                    <span class="section-count" id="roadmap-count">0</span>
                </div>

                <div class="roadmap-list" id="roadmap-list">
                    <!-- populated by JavaScript -->
                </div>

                <div class="empty-state" id="empty-state" style="display:none;">
                    <div class="empty-cloud">&#9729;</div>
                    <h2>Nothing here yet</h2>
                    <p id="empty-text">Roadmaps shared with you will show up here.</p>
                </div>
            </section>

            <section class="dash-col" id="accounts-col" style="display:none;">
                <div class="col-head">
                    <h2>Accounts</h2>
                    <span class="section-count" id="account-count">0</span>
                    <button class="btn btn-small push-right" id="new-account-btn">+ New account</button>
                </div>
                <p class="form-error" id="admin-error"></p>
                <div class="account-list" id="account-list"></div>
            </section>
        </div>
    </main>

    <!-- New account modal (admin) -->
    <div id="new-account-modal" class="modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>New account</h3>
                <button id="close-new-account" class="btn-close" aria-label="Close"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="new-username">Username</label>
                    <input type="text" id="new-username" placeholder="at least 3 characters" autocomplete="off" />
                </div>
                <div class="form-group">
                    <label for="new-password">Password</label>
                    <input type="password" id="new-password" placeholder="at least 6 characters" autocomplete="new-password" />
                </div>
                <p class="form-error" id="new-account-error"></p>
            </div>
            <div class="modal-footer">
                <button id="cancel-new-account" class="btn-ghost">Cancel</button>
                <button id="create-account-btn" class="btn">Create account</button>
            </div>
        </div>
    </div>

    <!-- Edit account modal (admin) -->
    <div id="edit-user-modal" class="modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="edit-user-title">Edit account</h3>
                <button id="close-edit-user" class="btn-close" aria-label="Close"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="edit-username">Username</label>
                    <input type="text" id="edit-username" autocomplete="off" />
                </div>
                <div class="form-group">
                    <label for="edit-password">New password</label>
                    <input type="password" id="edit-password" placeholder="leave empty to keep the current one" autocomplete="new-password" />
                </div>
                <p class="form-error" id="edit-user-error"></p>
            </div>
            <div class="modal-footer">
                <button id="cancel-edit-user" class="btn-ghost">Cancel</button>
                <button id="save-edit-user" class="btn">Save changes</button>
            </div>
        </div>
    </div>

    <!-- Delete account modal (admin) -->
    <div id="delete-user-modal" class="modal">
        <div class="modal-card modal-small">
            <div class="modal-header">
                <h3>Delete account?</h3>
                <button id="close-delete-user" class="btn-close" aria-label="Close"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
            </div>
            <div class="modal-body">
                <p class="delete-warning" id="delete-user-warning"></p>
            </div>
            <div class="modal-footer">
                <button id="cancel-delete-user" class="btn-ghost">Cancel</button>
                <button id="confirm-delete-user" class="btn-danger">Delete account</button>
            </div>
        </div>
    </div>

    <!-- Create roadmap modal -->
    <div id="create-modal" class="modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>New roadmap</h3>
                <button id="close-modal" class="btn-close" aria-label="Close"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="roadmap-name">Name</label>
                    <input type="text" id="roadmap-name" placeholder="e.g. Server roadmap" />
                </div>
                <div class="form-group">
                    <label for="roadmap-description">Description</label>
                    <textarea id="roadmap-description" rows="3" placeholder="What is this roadmap about?"></textarea>
                </div>
                <p class="form-error" id="create-error"></p>
            </div>
            <div class="modal-footer">
                <button id="cancel-btn" class="btn-ghost">Cancel</button>
                <button id="create-btn" class="btn">Create roadmap</button>
            </div>
        </div>
    </div>

    <!-- Edit roadmap modal -->
    <div id="rename-modal" class="modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Edit roadmap</h3>
                <button id="close-rename-modal" class="btn-close" aria-label="Close"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="rename-roadmap-name">Name</label>
                    <input type="text" id="rename-roadmap-name" />
                </div>
                <div class="form-group">
                    <label for="rename-roadmap-description">Description</label>
                    <textarea id="rename-roadmap-description" rows="3"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button id="cancel-rename-btn" class="btn-ghost">Cancel</button>
                <button id="rename-btn" class="btn">Save changes</button>
            </div>
        </div>
    </div>

    <!-- Delete roadmap modal -->
    <div id="delete-modal" class="modal">
        <div class="modal-card modal-small">
            <div class="modal-header">
                <h3>Delete roadmap?</h3>
                <button id="close-delete-modal" class="btn-close" aria-label="Close"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
            </div>
            <div class="modal-body">
                <p class="delete-warning">This removes the roadmap and every task in it. There is no undo.</p>
            </div>
            <div class="modal-footer">
                <button id="cancel-delete-btn" class="btn-ghost">Cancel</button>
                <button id="confirm-delete-btn" class="btn-danger">Delete roadmap</button>
            </div>
        </div>
    </div>

    <!-- Sharing modal -->
    <div id="access-modal" class="modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Share this roadmap</h3>
                <button id="close-access-modal" class="btn-close" aria-label="Close"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="access-username">Add a member by username</label>
                    <div class="access-add-row">
                        <input type="text" id="access-username" placeholder="username" />
                        <button id="access-add-btn" class="btn btn-small">Add</button>
                    </div>
                </div>
                <p class="form-error" id="access-error"></p>

                <div class="access-list" id="access-list"></div>

                <div class="public-share">
                    <label class="public-share-label">Public link. Anyone with the link can view this roadmap without an account.</label>
                    <button id="share-create-btn" class="btn-ghost btn-small">Create public link</button>
                    <div id="share-link-box" class="share-link-box" style="display:none;">
                        <input type="text" id="share-link-input" class="share-link-input" readonly />
                        <button id="share-copy-btn" class="btn btn-small">Copy</button>
                        <button id="share-disable-btn" class="btn-danger-ghost btn-small">Disable</button>
                    </div>
                    <p id="share-stats" class="share-stats" style="display:none;"></p>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="public/scripts/app.js"></script>
</body>

</html>
